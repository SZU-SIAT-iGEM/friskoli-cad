<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b25">
  <title>Friskoli-CAD</title>
  <link rel="icon" href="/assets/cad.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js"}}</script>
</head>
<body>
  <div class="app">
    <header class="menubar">
      <div class="brand"><img src="/assets/friskoli.svg" alt="Friskoli"><span class="brand-rule"></span><img class="cad-mark" src="/assets/cad.svg" alt="CAD"></div>
      <button id="open-button" class="menu-button" type="button" data-i18n="open">Open</button>
      <button id="save-button" class="menu-button" type="button" data-i18n="save">Save</button>
      <span class="project-title" id="project-title">—</span>
      <button id="settings-button" class="menu-button" type="button" data-i18n="settings">Settings</button>
    </header>
    <div class="workspacebar">
      <nav class="workspace-tabs" aria-label="Workspace">
        <button type="button" class="active" data-view="space" data-i18n="space">Space</button>
        <button type="button" data-view="workflow" data-i18n="workflow">Workflow</button>
        <button type="button" data-view="results" data-i18n="results">Results</button>
      </nav>
      <div class="run-tools">
        <label><span data-i18n="step">Step</span><input id="dt-input" type="number" min="0.000001" step="0.1" value="0.5" aria-label="Time step in seconds"><span>s</span></label>
        <label><span data-i18n="steps">Steps</span><input id="steps-input" type="number" min="1" max="100" step="1" value="8" aria-label="Number of steps"></label>
        <button id="run-button" class="run-button" type="button"><span aria-hidden="true">▶</span> <span data-i18n="run">Run</span></button>
      </div>
    </div>
    <main class="studio" id="studio">
      <aside class="toolrail" aria-label="Design tools">
        <button id="select-tool" class="active" type="button" title="Select" aria-label="Select">↖</button>
        <button id="population-tool" type="button" title="Place population" aria-label="Place population">◌</button>
        <span class="rail-rule"></span>
        <button id="fit-tool" type="button" title="Fit view" aria-label="Fit view">⌗</button>
        <button id="top-tool" type="button" title="Top view" aria-label="Top view">XY</button>
        <button id="front-tool" type="button" title="Front view" aria-label="Front view">XZ</button>
        <button id="right-tool" type="button" title="Right view" aria-label="Right view">YZ</button>
        <div class="rail-spacer"></div>
        <button id="objects-tool" type="button" title="Objects" aria-label="Objects">☷</button>
        <button id="properties-tool" type="button" title="Properties" aria-label="Properties">▤</button>
      </aside>
      <aside class="left-dock dock" id="left-dock">
        <div class="dock-tabs"><button type="button" class="active" data-left="objects" data-i18n="objects">Objects</button><button type="button" data-left="modules" data-i18n="modules">Modules</button><button class="dock-close" id="close-left" type="button" aria-label="Close objects">×</button></div>
        <div class="search-wrap"><input id="left-search" type="search" placeholder="Search" aria-label="Search objects or modules"></div>
        <div id="left-content" class="dock-scroll"></div>
      </aside>
      <section class="center-dock">
        <div class="documentbar"><span id="document-label" data-i18n="simulation">Simulation</span><span id="document-meta">—</span></div>
        <div class="viewport" id="viewport">
          <canvas id="spatial-canvas" tabindex="0" aria-label="3D space; drag to orbit, right drag to pan, scroll to zoom"></canvas>
          <div id="scene-annotations" class="scene-annotations"></div>
          <div class="view-controls" id="view-controls">
            <select id="camera-select" aria-label="Camera view"><option value="perspective" data-i18n="perspective">Perspective</option><option value="orthographic" data-i18n="orthographic">Orthographic</option><option value="top" data-i18n="top">Top · XY</option><option value="front" data-i18n="front">Front · XZ</option><option value="right" data-i18n="right">Right · YZ</option></select>
            <select id="field-select" aria-label="Concentration field"><option value="" data-i18n="noField">No field</option></select>
            <select id="slice-select" aria-label="Concentration field Z plane"></select>
          </div>
          <div class="viewport-bottom"><span id="view-readout">—</span><div class="zoom-controls"><button id="zoom-out" type="button" aria-label="Zoom out">−</button><button id="fit-button" type="button" data-i18n="fit">Fit</button><button id="zoom-in" type="button" aria-label="Zoom in">+</button></div></div>
          <div id="workflow-view" class="content-view" hidden></div>
          <div id="viewport-error" class="viewport-error" role="alert" hidden></div>
        </div>
        <section class="bottom-dock" id="bottom-dock">
          <div class="bottom-head"><span data-i18n="timeline">Timeline</span><strong id="time-label">—</strong><span id="frame-label">—</span></div>
          <div class="transport"><button id="previous-button" type="button" aria-label="Previous frame">‹</button><button id="play-button" type="button" aria-label="Play">▶</button><button id="next-button" type="button" aria-label="Next frame">›</button><input id="frame-range" type="range" min="0" max="0" value="0" aria-label="Replay frame"></div>
          <div id="event-track" class="event-track"></div>
        </section>
      </section>
      <aside class="right-dock dock" id="right-dock"><div class="dock-tabs"><button class="active" type="button" data-i18n="properties">Properties</button><button class="dock-close" id="close-right" type="button" aria-label="Close properties">×</button></div><div id="inspector" class="dock-scroll"></div></aside>
      <button id="dock-backdrop" class="dock-backdrop" type="button" aria-label="Close panel" hidden></button>
    </main>
    <footer class="statusbar"><span class="status-dot"></span><span id="status-message" role="status" aria-live="polite">Loading…</span><span class="status-spacer"></span><span id="status-count"></span><span id="status-version"></span></footer>
  </div>
  <input id="project-file" type="file" accept=".json,application/json" hidden>
  <div id="context-menu" class="context-menu" hidden></div>
  <div id="settings-overlay" class="settings-overlay" hidden><div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-heading"><div class="dialog-head"><h2 id="settings-heading" data-i18n="settings">Settings</h2><button id="settings-close" type="button" aria-label="Close settings">×</button></div><label for="language-select" data-i18n="language">Interface language</label><select id="language-select"><option value="en">English</option><option value="zh-CN">中文</option></select></div></div>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
