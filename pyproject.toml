[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friskoli-cad"
version = "0.2.0"
description = "Modular chemotaxis CAD contracts and numerical engine"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "numpy>=1.26,<3", "rfc8785==0.1.4", "psutil==7.2.2"]

[project.optional-dependencies]
cuda11 = ["cupy-cuda11x==13.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"friskoli_cad.protocol" = ["schemas/*.json"]
"friskoli_cad.science" = ["data/*.json"]
"friskoli_cad.engine" = ["manifests/*.json", "declarations/*.json"]
"friskoli_cad" = ["examples/*.json", "web/*.html", "web/*.css", "web/*.mjs", "web/assets/*.svg", "web/vendor/three/build/*.js", "web/vendor/three/examples/jsm/controls/*.js", "web/vendor/three/LICENSE", "web/vendor/katex/*.mjs", "web/vendor/katex/*.css", "web/vendor/katex/LICENSE", "web/vendor/katex/README.md", "web/vendor/katex/fonts/*.woff2", "web/vendor/katex/fonts/*.woff", "web/vendor/katex/fonts/*.ttf"]
